<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maxx HubApp — Offline</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0c2d48; font-family: system-ui, sans-serif;
      padding: 24px; text-align: center;
    }
    img { width: 120px; height: auto; margin-bottom: 32px; }
    h1 { font-size: 20px; font-weight: 700; color: #fff; margin-bottom: 8px; }
    p { font-size: 14px; color: rgba(255,255,255,0.6); line-height: 1.6; max-width: 260px; }
    button {
      margin-top: 28px; padding: 14px 28px; border-radius: 12px;
      background: #1565a0; color: #fff; font-size: 15px; font-weight: 700;
      border: none; cursor: pointer;
    }
  </style>
</head>
<body>
  <img src="/logo.png" alt="Maxx Orthopedics" />
  <h1>You're offline</h1>
  <p>Check your connection and try again.</p>
  <button onclick="window.location.reload()">Retry</button>
</body>
</html>
